<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - 404</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=VT323">
  <style>
    a {
        color: white;
    }
    a:hover {
        color: red;
        cursor: pointer;
    }
    body,
    h1,
    h2,
    h3,
    h4,
    p,
    a {
      color: #e0e2f4;
    }

    body,
    p {
      font: normal 20px/1.25rem 'VT323', monospace;
    }

    h1 {
      font: normal 2.75rem/1.05em 'VT323', monospace;
    }

    h2 {
      font: normal 2.25rem/1.25em 'VT323', monospace;
    }

    h3 {
      font: lighter 1.5rem/1.25em 'VT323', monospace;
    }

    h4 {
      font: lighter 1.125rem/1.2222222em 'VT323', monospace;
    }

    body {
      background: #0414a7;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      margin: auto;
      max-width: 640px;
    }

    .bsod {
      padding-top: 10%;
    }

    .bsod .neg {
      text-align: center;
      color: #0414a7;
    }

    .bsod .neg .bg {
      background: #aaaaaa;
      padding: 0 15px 2px 13px;
    }

    .bsod .title {
      margin-bottom: 50px;
    }

    .bsod .nav {
      margin-top: 35px;
      text-align: center;
    }

    .bsod .nav .link {
      text-decoration: none;
      padding: 0 9px 2px 8px;
    }

    .bsod .nav .link:hover,
    .bsod .nav .link:focus {
      background: #aaaaaa;
      color: #0414a7;
    }
  </style>
</head>
<body>
  <main class="bsod container">
    <h1 class="neg title"><span class="bg">Error - 404</span></h1>
    <p>Uh oh! This website has been moved elsewhere. You have a few options:</p>
    * Visit <a href="https://www.hawktwosystems.no">hawktwosystems.no</a><br>
    * Contact <a href="mailto:support@hawktwosystems.no">support</a> if you have any questions or concerns<br>
    * Do nothing
    </p>
    <nav class="nav">
      <a href="https://www.hawktwosystems.no" class="link">hawktwosystems</a>&nbsp;|&nbsp;<a href="https://www.github.com/HawkTwoSystems" class="link">GitHub</a>
    </nav>
    <nav class="nav">
      <p>Copyright (C) 2026 Hawk Two Systems (Fredrik Pettersen) All rights reserved</p>
    </nav>
  </main>
</body>
</html>
